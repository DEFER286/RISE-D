<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password Haaraa Kaa'i | RISE TODAY</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: #000; color: #fff; font-family: 'Roboto', Arial, sans-serif; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #1a1a1a; border: 1px solid #444; border-radius: 12px; padding: 30px; width: 100%; max-width: 400px; }
        h1 { font-size: 20px; text-align: center; margin: 0 0 20px; }
        .field { position: relative; margin-bottom: 16px; }
        input { width: 100%; background: #222; border: 1px solid #555; color: #fff; border-radius: 6px; padding: 10px 44px 10px 10px; font-size: 15px; outline: none; }
        #eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #aaa; cursor: pointer; padding: 6px; display: flex; }
        #save { width: 100%; background: #fff; color: #000; border: none; padding: 11px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        #save:disabled { opacity: 0.6; cursor: default; }
        #status { text-align: center; color: #aaa; font-size: 14px; line-height: 1.5; }
        #form { display: none; }
        a { color: #aaa; display: block; text-align: center; margin-top: 18px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔑 Password Haaraa Kaa'i</h1>

        <p id="status">Link kee mirkaneessaa jira...</p>

        <div id="form">
            <div class="field">
                <input id="new-password" type="password" placeholder="Password haaraa (yoo xiqqaate 6)..." autocomplete="new-password">
                <button type="button" id="eye" aria-label="Show password"></button>
            </div>
            <button id="save" type="button">Save godhi</button>
        </div>

        <a href="/home.html">← Gara Home</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabase-config.js"></script>
    <script>
        const EYE_ON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        const EYE_OFF = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

        const input = document.getElementById('new-password');
        const eye = document.getElementById('eye');
        const form = document.getElementById('form');
        const statusEl = document.getElementById('status');
        const saveBtn = document.getElementById('save');
        let shown = false;

        eye.innerHTML = EYE_ON;
        eye.addEventListener('click', () => {
            const hide = input.type === 'text';
            input.type = hide ? 'password' : 'text';
            eye.innerHTML = hide ? EYE_ON : EYE_OFF;
            eye.setAttribute('aria-label', hide ? 'Show password' : 'Hide password');
        });

        function showForm() {
            if (shown) return;
            shown = true;
            statusEl.style.display = 'none';
            form.style.display = 'block';
        }

        if (typeof sbClient === 'undefined') {
            statusEl.textContent = "Supabase hin fe'amne. Page deebi'ii bani.";
        } else {
            // Link email irraa dhufu yeroo ta'u, Supabase ofumaan PASSWORD_RECOVERY ni waama
            sbClient.auth.onAuthStateChange((event, session) => {
                if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) showForm();
            });
            sbClient.auth.getSession().then(({ data }) => {
                if (data && data.session) showForm();
            });
            setTimeout(() => {
                if (!shown) {
                    statusEl.textContent = "Link kun hojii irra oolee ykn yeroon isaa darbeera. Website irratti 'Forgot password?' deebi'ii tuqii link haaraa gaafadhu.";
                }
            }, 4000);
        }

        saveBtn.addEventListener('click', async () => {
            const pw = input.value.trim();
            if (pw.length < 6) {
                alert("Password yoo xiqqaate qubee 6 ta'uu qaba!");
                return;
            }
            saveBtn.disabled = true;
            try {
                const { error } = await sbClient.auth.updateUser({ password: pw });
                if (error) {
                    alert("Rakkina: " + error.message);
                    saveBtn.disabled = false;
                } else {
                    alert("Password haaraan kuufameera! 🎉");
                    window.location.href = '/home.html';
                }
            } catch (e) {
                alert("Dogoggora: " + e.message);
                saveBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
