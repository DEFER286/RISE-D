
backend:
  name: github
  repo: DEFER286/RISE-D
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  # Motivational Speeches JSON
  - name: "motivation_data"
    label: "Motivational Speeches (JSON)"
    files:
      - label: "Barruulee Onnachiisoo Hunda"
        name: "motivation"
        file: "data/motivation.json"
        fields:
          - label: "Tarree Barruulee Onnachiisoo"
            name: "items"
            widget: "list"
            add_to_top: true
            fields:
              - { label: "Mata-duree", name: "title", widget: "string" }
              - { label: "Slug", name: "slug", widget: "string", hint: "Fakkeenya: naannoo-kee-ilaali (Iddoo duwwaa dhiisi malee sarara xiqqaan walitti fidi)" }
              - { label: "Guyyaa", name: "date", widget: "datetime" }
              - { label: "Barruu Onnachiisoo", name: "body", widget: "markdown" }
              - { label: "Meta Description", name: "description", widget: "string", required: false }
              - { label: "Photo", name: "image", widget: "image", required: false }

              # Photo Attribution
              - { label: "Photographer Name", name: "imageCredit", widget: "string", required: false, hint: "Maqaa nama suuraa kaasee" }
              - { label: "Image Source", name: "imageSource", widget: "string", required: false, hint: "Fakkeenya: Unsplash, Pexels, Pixabay" }
              - { label: "Original Photo URL", name: "imageSourceUrl", widget: "string", required: false, hint: "Link suuraa original" }
              - { label: "Image License", name: "imageLicense", widget: "string", required: false, hint: "Fakkeenya: Unsplash License" }

  # Instructive Stories JSON
  - name: "instructive_data"
    label: "Instructive Stories (JSON)"
    files:
      - label: "Barruelee Barsiisoo Hunda"
        name: "stories"
        file: "data/stories.json"
        fields:
          - label: "Tarree Seenaawwanii (List of Stories)"
            name: "items"
            widget: "list"
            add_to_top: true
            fields:
              - { label: "Mata-duree", name: "title", widget: "string" }
              - { label: "Slug", name: "slug", widget: "string", hint: "Fakkeenya: gatii-kee-beeki (Iddoo duwwaa dhiisi malee sarara xiqqaan walitti fidi)" }
              - { label: "Guyyaa", name: "date", widget: "datetime" }
              - { label: "Barruu Barsiisoo", name: "body", widget: "markdown" }
              - { label: "Meta Description", name: "description", widget: "string", required: false }
              - { label: "Photo", name: "image", widget: "image", required: false }

              # Photo Attribution
              - { label: "Photographer Name", name: "imageCredit", widget: "string", required: false, hint: "Maqaa nama suuraa kaasee" }
              - { label: "Image Source", name: "imageSource", widget: "string", required: false, hint: "Fakkeenya: Unsplash, Pexels, Pixabay" }
              - { label: "Original Photo URL", name: "imageSourceUrl", widget: "string", required: false, hint: "Link suuraa original" }
              - { label: "Image License", name: "imageLicense", widget: "string", required: false, hint: "Fakkeenya: Unsplash License" }

  # Gorsa Barnootaa JSON
  - name: "education_data"
    label: "Gorsa Barnootaa (JSON)"
    files:
      - label: "Barruulee Gorsa Barnootaa Hunda"
        name: "education"
        file: "data/education.json"
        fields:
          - label: "Tarree Barruulee Gorsa Barnootaa"
            name: "items"
            widget: "list"
            add_to_top: true
            fields:
              - { label: "Mata-duree", name: "title", widget: "string" }
              - { label: "Slug", name: "slug", widget: "string", hint: "Fakkeenya: gorsa-barnootaa (Iddoo duwwaa dhiisi malee sarara xiqqaan walitti fidi)" }
              - { label: "Guyyaa", name: "date", widget: "datetime" }
              - { label: "Qabiyyee Barruu", name: "body", widget: "markdown" }
              - { label: "Meta Description", name: "description", widget: "string", required: false }
              - { label: "Photo", name: "image", widget: "image", required: false }

              # Photo Attribution
              - { label: "Photographer Name", name: "imageCredit", widget: "string", required: false, hint: "Maqaa nama suuraa kaasee" }
              - { label: "Image Source", name: "imageSource", widget: "string", required: false, hint: "Fakkeenya: Unsplash, Pexels, Pixabay" }
              - { label: "Original Photo URL", name: "imageSourceUrl", widget: "string", required: false, hint: "Link suuraa original" }
              - { label: "Image License", name: "imageLicense", widget: "string", required: false, hint: "Fakkeenya: Unsplash License" }
